[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["gallery-update-backups", "maintenance-backups", ".test-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.djlint]
profile = "jinja"
indent = 2
max_line_length = 110
preserve_blank_lines = true
